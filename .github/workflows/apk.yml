name: Tao APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-Nha-Minh-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Remote-Nha-Minh.apk
          gh release create "build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" Remote-Nha-Minh.apk --target "$GITHUB_SHA" --title "Remote Nhà Mình" --notes "Bản cài Android dùng thử."
